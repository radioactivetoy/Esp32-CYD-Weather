[platformio]
default_envs = esp32-2432S024C

[env:esp32-2432S024C]
platform = espressif32 @ 6.12.0 ; Arduino core 2.0.17 — core 3.x removes ledcSetup/ledcAttachPin
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder ; Decode crash backtraces in the monitor
upload_speed = 921600
; Two 1.9MB app slots, needed for OTA updates. NVS (settings) sits at the same
; offset as in huge_app.csv, so switching keeps WiFi and settings.
board_build.partitions = min_spiffs.csv

lib_deps =
    lvgl/lvgl @ ^8.3.11
    bodmer/TFT_eSPI @ ^2.5.43
    bblanchon/ArduinoJson @ ^7.0.3
    tzapu/WiFiManager @ ^2.0.17

build_unflags = -Os

build_flags =
    -O2
    -D CORE_DEBUG_LEVEL=1
    -D LV_CONF_INCLUDE_SIMPLE
    -D LV_COMP_CONF_INCLUDE_SIMPLE
    -D LV_LVGL_H_INCLUDE_SIMPLE
    -I src
    -D LV_FONT_MONTSERRAT_12=1
    -D LV_FONT_MONTSERRAT_14=1
    -D LV_FONT_MONTSERRAT_16=1
    -D LV_FONT_MONTSERRAT_20=1
    -D LV_FONT_MONTSERRAT_32=1
    -D USER_SETUP_LOADED=1
    -D ILI9341_DRIVER=1
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D TFT_BL=27
    -D TFT_BACKLIGHT_ON=HIGH
    -D SPI_FREQUENCY=55000000
    -D SPI_READ_FREQUENCY=20000000
    -D TFT_INVERSION_OFF

; Upload over WiFi: pio run -e ota -t upload
; The OTA password is the device's settings password. It is read from the
; WEATHER_OTA_PASSWORD environment variable so it never lands in git; leave
; it unset if the device has no password.
[env:ota]
extends = env:esp32-2432S024C
upload_protocol = espota
upload_port = weatherclock.local
upload_flags = --auth=${sysenv.WEATHER_OTA_PASSWORD}
